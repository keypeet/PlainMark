<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PlainMark — UI Design Prototype</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f6f7f9;
    --bg-panel: #fbfcfd;
    --border: #e3e6ea;
    --text: #1f2328;
    --text-soft: #59636e;
    --accent: #2f6feb;
    --accent-soft: #ddeaff;
    --editor-bg: #ffffff;
    --code-bg: #f3f4f6;
    --toolbar-bg: #f6f7f9;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
    --mono: ui-monospace, "Cascadia Code", "Consolas", "JetBrains Mono", monospace;
    --sans: -apple-system, "Segoe UI", "Sarabun", system-ui, sans-serif;
  }
  [data-theme="dark"] {
    --bg: #0d1117;
    --bg-soft: #161b22;
    --bg-panel: #0d1117;
    --border: #30363d;
    --text: #e6edf3;
    --text-soft: #9198a1;
    --accent: #4f8cff;
    --accent-soft: #1c2d4a;
    --editor-bg: #0d1117;
    --code-bg: #161b22;
    --toolbar-bg: #161b22;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    font-size: 14px;
  }

  /* ---------- Menu bar ---------- */
  .menubar {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 10px;
    background: var(--bg-soft);
    border-bottom: 1px solid var(--border);
    user-select: none;
    flex-shrink: 0;
  }
  .brand {
    display: flex; align-items: center; gap: 8px;
    font-weight: 700; margin-right: 12px; letter-spacing: .2px;
  }
  .brand .logo {
    width: 22px; height: 22px; border-radius: 6px;
    background: linear-gradient(135deg, var(--accent), #7aa7ff);
    color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 800;
  }
  .menu-item {
    padding: 5px 10px; border-radius: 6px; cursor: pointer; color: var(--text-soft);
  }
  .menu-item:hover { background: var(--bg); color: var(--text); }
  .spacer { flex: 1; }
  .seg {
    display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  }
  .seg button {
    border: 0; background: var(--bg); color: var(--text-soft); padding: 5px 10px;
    cursor: pointer; font-size: 12.5px;
  }
  .seg button.active { background: var(--accent); color: #fff; }
  .icon-btn {
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    width: 32px; height: 30px; border-radius: 8px; cursor: pointer; font-size: 15px;
  }
  .icon-btn:hover { background: var(--accent-soft); }

  /* ---------- Workspace ---------- */
  .workspace { display: flex; flex: 1; min-height: 0; }

  .pane { display: flex; flex-direction: column; min-width: 0; }
  .pane-header {
    padding: 6px 14px; font-size: 11.5px; letter-spacing: .5px; text-transform: uppercase;
    color: var(--text-soft); background: var(--bg-soft); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

  /* Editor */
  .editor-pane { flex: 1; border-right: 1px solid var(--border); }
  .editor-wrap { flex: 1; display: flex; min-height: 0; background: var(--editor-bg); position: relative; }
  .editor-wrap.drag::after {
    content: "วางรูปที่นี่เพื่อแทรก (ฝังเป็น base64)"; position: absolute; inset: 8px;
    border: 2px dashed var(--accent); border-radius: 12px; background: var(--accent-soft);
    display: grid; place-items: center; color: var(--accent); font-weight: 700; pointer-events: none;
  }
  .gutter {
    padding: 14px 8px 14px 12px; text-align: right; color: var(--text-soft);
    font-family: var(--mono); font-size: 13px; line-height: 1.7; user-select: none;
    background: var(--bg-soft); border-right: 1px solid var(--border); min-width: 42px;
    overflow: hidden;
  }
  #editor {
    flex: 1; border: 0; outline: 0; resize: none; padding: 14px 16px;
    font-family: var(--mono); font-size: 13.5px; line-height: 1.7;
    background: var(--editor-bg); color: var(--text); tab-size: 2;
  }

  /* Preview */
  .preview-pane { flex: 1; }
  #preview {
    flex: 1; overflow: auto; padding: 18px 26px; line-height: 1.65;
    background: var(--bg-panel);
  }
  #preview h1 { font-size: 1.9em; border-bottom: 1px solid var(--border); padding-bottom: .25em; margin-top: .3em; }
  #preview h2 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: .2em; }
  #preview h3 { font-size: 1.25em; }
  #preview h4 { font-size: 1.05em; }
  #preview code {
    font-family: var(--mono); background: var(--code-bg); padding: .15em .4em;
    border-radius: 5px; font-size: .9em;
  }
  #preview pre {
    background: var(--code-bg); padding: 12px 14px; border-radius: 8px; overflow: auto;
    border: 1px solid var(--border);
  }
  #preview pre code { background: none; padding: 0; }
  #preview blockquote {
    margin: .6em 0; padding: .2em 1em; color: var(--text-soft);
    border-left: 4px solid var(--accent);
  }
  #preview table { border-collapse: collapse; margin: .6em 0; }
  #preview th, #preview td { border: 1px solid var(--border); padding: 6px 12px; }
  #preview th { background: var(--bg-soft); }
  #preview hr { border: 0; border-top: 1px solid var(--border); margin: 1.2em 0; }
  #preview a { color: var(--accent); }
  #preview img { max-width: 100%; max-height: 360px; border-radius: 6px; border: 1px solid var(--border); }
  #preview ul.task { list-style: none; padding-left: 1.2em; }
  #preview .task input { margin-right: 6px; }

  /* ---------- Toolbar (right) ---------- */
  .toolbar {
    width: 56px; background: var(--toolbar-bg); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0;
    overflow-y: auto; flex-shrink: 0;
  }
  .toolbar .tb {
    width: 40px; height: 40px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--bg); color: var(--text); cursor: pointer; font-size: 16px;
    display: grid; place-items: center; position: relative; transition: .12s;
  }
  .toolbar .tb:hover { background: var(--accent); color: #fff; transform: translateY(-1px); }
  .toolbar .tb .lbl { font-family: var(--mono); font-weight: 700; font-size: 13px; }
  .toolbar .sep { width: 28px; height: 1px; background: var(--border); margin: 4px 0; }

  /* ---------- Rich tooltip (preview ตัวอย่างผลลัพธ์) ---------- */
  .tipcard {
    position: fixed; z-index: 50; width: 248px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,.20); padding: 12px 14px;
    font-family: var(--sans); opacity: 0; transform: translateX(8px);
    transition: opacity .12s ease, transform .12s ease; pointer-events: none;
  }
  .tipcard.show { opacity: 1; transform: translateX(0); }
  .tipcard .tip-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 9px; }
  .tipcard .tip-name { font-weight: 700; font-size: 13px; }
  .tipcard .tip-key {
    font-family: var(--mono); font-size: 10.5px; color: var(--text-soft);
    background: var(--bg-soft); border: 1px solid var(--border); padding: 2px 6px; border-radius: 5px; white-space: nowrap;
  }
  .tipcard .tip-label { font-size: 10px; color: var(--text-soft); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 5px; }
  .tipcard .tip-ex {
    background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 11px; font-size: 12.5px; line-height: 1.45; overflow: hidden;
  }
  .tipcard .tip-ex * { margin: 0; }
  .tipcard .tip-code {
    margin-top: 9px; font-family: var(--mono); font-size: 11px; color: var(--text-soft);
    background: var(--code-bg); padding: 6px 8px; border-radius: 6px;
    white-space: pre-wrap; word-break: break-word;
  }

  /* ---------- Status bar ---------- */
  .statusbar {
    display: flex; align-items: center; gap: 16px; padding: 4px 14px;
    background: var(--bg-soft); border-top: 1px solid var(--border); color: var(--text-soft);
    font-size: 12px; flex-shrink: 0;
  }
  .statusbar .right { margin-left: auto; display: flex; gap: 16px; }
  .badge-dirty { color: #d97706; }
  .badge-saved { color: #16a34a; }

  .hide { display: none !important; }
  .note {
    position: fixed; bottom: 44px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #fff; padding: 8px 16px; border-radius: 8px;
    box-shadow: var(--shadow); opacity: 0; transition: .2s; pointer-events: none; font-size: 13px;
  }
  .note.show { opacity: 1; }
</style>
</head>
<body data-theme="light">

  <!-- ===== Menu bar ===== -->
  <div class="menubar">
    <div class="brand"><span class="logo">P</span> PlainMark</div>
    <div class="menu-item" onclick="toast('New document')">File</div>
    <div class="menu-item" onclick="toast('Edit menu')">Edit</div>
    <div class="menu-item" onclick="toast('View menu')">View</div>
    <div class="menu-item" onclick="toast('Export → .md / .txt')">Export</div>
    <div class="menu-item" onclick="toast('Help / Markdown Cheat Sheet')">Help</div>

    <div class="spacer"></div>

    <div class="seg" title="Layout">
      <button id="seg-split" class="active" onclick="setLayout('split')">⬓ Split</button>
      <button id="seg-edit" onclick="setLayout('edit')">✎ Editor</button>
      <button id="seg-prev" onclick="setLayout('prev')">◉ Preview</button>
    </div>
    <button class="icon-btn" title="สลับธีม Light/Dark" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>

  <!-- ===== Workspace ===== -->
  <div class="workspace">
    <!-- Editor -->
    <div class="pane editor-pane" id="editorPane">
      <div class="pane-header"><span class="dot"></span> Editor — untitled.md</div>
      <div class="editor-wrap" id="editorWrap">
        <div class="gutter" id="gutter">1</div>
        <textarea id="editor" spellcheck="false" placeholder="พิมพ์ข้อความได้เลย เหมือน Notepad…  กดปุ่มด้านขวาเพื่อจัดรูปแบบ  หรือก็อปรูปจากที่อื่นแล้ว Ctrl+V วางได้เลย"></textarea>
      </div>
    </div>

    <!-- Preview -->
    <div class="pane preview-pane" id="previewPane">
      <div class="pane-header"><span class="dot"></span> Markdown Preview — เรียลไทม์</div>
      <div id="preview"></div>
    </div>

    <!-- Toolbar (right) — แต่ละปุ่มมี data-kind ใช้ผูกกับ tooltip ตัวอย่างผลลัพธ์ -->
    <div class="toolbar" id="toolbar">
      <button class="tb" data-kind="heading" onclick="fmt('heading')"><span class="lbl">H</span></button>
      <button class="tb" data-kind="bold" onclick="fmt('bold')"><b>B</b></button>
      <button class="tb" data-kind="italic" onclick="fmt('italic')"><i>I</i></button>
      <div class="sep"></div>
      <button class="tb" data-kind="list" onclick="fmt('list')">≡</button>
      <button class="tb" data-kind="task" onclick="fmt('task')">☑</button>
      <button class="tb" data-kind="quote" onclick="fmt('quote')">❝</button>
      <div class="sep"></div>
      <button class="tb" data-kind="table" onclick="fmt('table')">▦</button>
      <button class="tb" data-kind="codeblock" onclick="fmt('codeblock')">{ }</button>
      <button class="tb" data-kind="code" onclick="fmt('code')"><span class="lbl">&lt;&gt;</span></button>
      <div class="sep"></div>
      <button class="tb" data-kind="link" onclick="fmt('link')">🔗</button>
      <button class="tb" data-kind="image" onclick="fmt('image')">🖼</button>
      <button class="tb" data-kind="hr" onclick="fmt('hr')">―</button>
    </div>
  </div>

  <!-- ===== Status bar ===== -->
  <div class="statusbar">
    <span id="status" class="badge-saved">● Saved</span>
    <span>UTF-8</span>
    <span>Markdown</span>
    <div class="right">
      <span id="words">0 words</span>
      <span id="chars">0 chars</span>
      <span id="cursor">Ln 1, Col 1</span>
    </div>
  </div>

  <!-- Rich tooltip element (เติมเนื้อหาด้วย JS) -->
  <div class="tipcard" id="tipcard">
    <div class="tip-head"><span class="tip-name"></span><span class="tip-key"></span></div>
    <div class="tip-label">ตัวอย่างเมื่อกด</div>
    <div class="tip-ex"></div>
    <div class="tip-code"></div>
  </div>

  <div class="note" id="toast"></div>

<script>
/* ============================================================
   PlainMark — Design Prototype (มินิมัล ใช้สาธิต UX เท่านั้น)
   ตัวจริงจะใช้ CodeMirror 6 + markdown-it (ดู tech-stack.md)
   ฟีเจอร์ในไฟล์นี้ที่สาธิตเพิ่ม:
     1) วางรูปจาก clipboard (Ctrl+V) / ลากวาง → ฝังเป็น base64 (reference-style)
     2) tooltip ปุ่ม Toolbar แสดง "ตัวอย่างผลลัพธ์" เมื่อ hover
   ============================================================ */

const ed = document.getElementById('editor');
const preview = document.getElementById('preview');
const gutter = document.getElementById('gutter');

const SAMPLE = `# PlainMark
พิมพ์ข้อความ **ธรรมดา** แล้วเห็นเป็น *Markdown* สวยงามทันที

## ฟีเจอร์เด่น
- พิมพ์ง่ายเหมือน Notepad
- ไม่ต้องจำ syntax — กดปุ่มด้านขวาได้เลย (hover ดูตัวอย่างก่อนกด)
- ก็อปรูปจากที่อื่นแล้ว **Ctrl+V วางได้ทันที** (ฝังเป็น base64 ไม่ต้องเซฟไฟล์)
- [x] Export .md และ .txt

> เคล็ดลับ: เลือกข้อความแล้วกดปุ่ม Bold เพื่อครอบ **ตัวหนา**

| ปุ่ม | ผลลัพธ์ |
| --- | --- |
| Heading | # หัวข้อ |
| Table | ตาราง |

\`\`\`js
console.log("hello PlainMark");
\`\`\`

อ่านเพิ่ม: [Markdown Guide](https://www.markdownguide.org/cheat-sheet/)
`;

/* ---------- มินิ Markdown parser (สาธิต — รองรับ reference image/link) ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inline(s, refs){
  refs = refs || {};
  return s
    // reference-style image: ![alt][id]  (ใช้กับรูปที่วางมา = base64)
    .replace(/!\[([^\]]*)\]\[([^\]]+)\]/g,(m,a,id)=> refs[id] ? `<img alt="${a}" src="${refs[id]}">` : m)
    // reference-style link: [text][id]
    .replace(/\[([^\]]+)\]\[([^\]]+)\]/g,(m,tx,id)=> refs[id] ? `<a href="${refs[id]}">${tx}</a>` : m)
    // inline image / link
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img alt="$1" src="$2">')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g,'<em>$1</em>')
    .replace(/~~([^~]+)~~/g,'<del>$1</del>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
}
function mdToHtml(src){
  // ดึง reference definitions ออกก่อน: [id]: <url|dataURL>
  const refs = {};
  src = src.replace(/^\[([^\]]+)\]:[ \t]*(\S+)[ \t]*$/gm, (m,id,url)=>{ refs[id]=url; return ''; });

  const lines = src.split('\n');
  let html='', i=0;
  while(i<lines.length){
    let l = lines[i];
    // code block
    if(/^```/.test(l)){
      let lang=l.slice(3).trim(); let buf=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])){buf.push(lines[i]);i++;}
      i++; html+=`<pre><code class="language-${lang}">${esc(buf.join('\n'))}</code></pre>`; continue;
    }
    // heading
    let h=l.match(/^(#{1,6})\s+(.*)/);
    if(h){html+=`<h${h[1].length}>${inline(esc(h[2]),refs)}</h${h[1].length}>`;i++;continue;}
    // hr
    if(/^(-{3,}|\*{3,})\s*$/.test(l)){html+='<hr>';i++;continue;}
    // table
    if(/\|/.test(l) && i+1<lines.length && /^\s*\|?[\s:\-|]+\|?\s*$/.test(lines[i+1])){
      const row=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      let head=row(l); i+=2; let body='';
      while(i<lines.length && /\|/.test(lines[i])){
        body+='<tr>'+row(lines[i]).map(c=>`<td>${inline(esc(c),refs)}</td>`).join('')+'</tr>';i++;
      }
      html+=`<table><thead><tr>${head.map(c=>`<th>${inline(esc(c),refs)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;continue;
    }
    // blockquote
    if(/^>\s?/.test(l)){
      let buf=[];
      while(i<lines.length && /^>\s?/.test(lines[i])){buf.push(lines[i].replace(/^>\s?/,''));i++;}
      html+=`<blockquote>${inline(esc(buf.join(' ')),refs)}</blockquote>`;continue;
    }
    // task list
    if(/^\s*[-*]\s+\[[ xX]\]\s+/.test(l)){
      let buf='';
      while(i<lines.length && /^\s*[-*]\s+\[[ xX]\]\s+/.test(lines[i])){
        let m=lines[i].match(/\[([ xX])\]\s+(.*)/);
        buf+=`<li class="task"><input type="checkbox" ${/x/i.test(m[1])?'checked':''} disabled>${inline(esc(m[2]),refs)}</li>`;i++;
      }
      html+=`<ul class="task">${buf}</ul>`;continue;
    }
    // unordered list
    if(/^\s*[-*]\s+/.test(l)){
      let buf='';
      while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])){buf+=`<li>${inline(esc(lines[i].replace(/^\s*[-*]\s+/,'')),refs)}</li>`;i++;}
      html+=`<ul>${buf}</ul>`;continue;
    }
    // ordered list
    if(/^\s*\d+\.\s+/.test(l)){
      let buf='';
      while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){buf+=`<li>${inline(esc(lines[i].replace(/^\s*\d+\.\s+/,'')),refs)}</li>`;i++;}
      html+=`<ol>${buf}</ol>`;continue;
    }
    // blank
    if(l.trim()===''){i++;continue;}
    // paragraph
    let buf=[];
    while(i<lines.length && lines[i].trim()!=='' && !/^(#{1,6}\s|>|\s*[-*]\s|\s*\d+\.\s|```|\|)/.test(lines[i])){buf.push(lines[i]);i++;}
    html+=`<p>${inline(esc(buf.join(' ')),refs)}</p>`;
  }
  return html;
}

/* ---------- render + stats ---------- */
let dirty=false, t;
function render(){
  preview.innerHTML = mdToHtml(ed.value);
  const lines = ed.value.split('\n').length;
  gutter.innerHTML = Array.from({length:lines},(_,k)=>k+1).join('<br>');
  const words = (ed.value.trim().match(/\S+/g)||[]).length;
  document.getElementById('words').textContent = words+' words';
  document.getElementById('chars').textContent = ed.value.length+' chars';
}
function debounced(){ clearTimeout(t); t=setTimeout(render,40); markDirty(); }
function markDirty(){ dirty=true; const s=document.getElementById('status'); s.textContent='● Unsaved'; s.className='badge-dirty'; }
ed.addEventListener('input', debounced);
ed.addEventListener('keyup', updateCursor);
ed.addEventListener('click', updateCursor);
function updateCursor(){
  const pos=ed.selectionStart, before=ed.value.slice(0,pos);
  const ln=before.split('\n').length, col=pos-before.lastIndexOf('\n');
  document.getElementById('cursor').textContent=`Ln ${ln}, Col ${col}`;
}

/* ---------- toolbar formatting ---------- */
function wrap(pre,post,placeholder){
  const s=ed.selectionStart,e=ed.selectionEnd,sel=ed.value.slice(s,e)||placeholder;
  ed.value=ed.value.slice(0,s)+pre+sel+post+ed.value.slice(e);
  ed.focus(); ed.selectionStart=s+pre.length; ed.selectionEnd=s+pre.length+sel.length;
  debounced();
}
function linePrefix(prefix){
  const s=ed.selectionStart,e=ed.selectionEnd;
  const start=ed.value.lastIndexOf('\n',s-1)+1;
  const block=ed.value.slice(start,e);
  const out=block.split('\n').map(l=>prefix+l).join('\n');
  ed.value=ed.value.slice(0,start)+out+ed.value.slice(e);
  ed.focus(); debounced();
}
function insert(text){
  const s=ed.selectionStart;
  ed.value=ed.value.slice(0,s)+text+ed.value.slice(s);
  ed.focus(); ed.selectionStart=ed.selectionEnd=s+text.length; debounced();
}
function fmt(kind){
  switch(kind){
    case 'heading': linePrefix('# '); break;
    case 'bold': wrap('**','**','ตัวหนา'); break;
    case 'italic': wrap('*','*','ตัวเอียง'); break;
    case 'code': wrap('`','`','code'); break;
    case 'list': linePrefix('- '); break;
    case 'task': linePrefix('- [ ] '); break;
    case 'quote': linePrefix('> '); break;
    case 'hr': insert('\n---\n'); break;
    case 'link': wrap('[','](https://)','ข้อความลิงก์'); break;
    case 'image': insert('![alt](image.png)'); break;
    case 'codeblock': insert('\n```js\n\n```\n'); break;
    case 'table': insert('\n| Col 1 | Col 2 |\n| --- | --- |\n| a | b |\n'); break;
  }
}

/* ============================================================
   1) วางรูปจาก clipboard / ลากวาง → ฝังเป็น base64 (reference-style)
   ============================================================ */
let imgCount = 0;
function embedImage(file){
  const reader = new FileReader();
  reader.onload = ev => {
    const dataUrl = ev.target.result;          // data:image/png;base64,....
    imgCount++;
    const id = 'img' + imgCount;
    // แทรกแบบ reference เพื่อให้ editor ยังอ่านง่าย (ไม่มี base64 ยาวๆ คั่นกลางข้อความ)
    insert(`![วางรูปภาพ][${id}]\n`);
    // เก็บ data URL ไว้ท้ายเอกสารเป็น reference definition
    ed.value += `\n[${id}]: ${dataUrl}\n`;
    debounced();
    toast('🖼 วางรูปแล้ว — ฝังเป็น base64 (ไม่ต้องเซฟไฟล์)');
  };
  reader.readAsDataURL(file);
}
// paste จาก clipboard
ed.addEventListener('paste', e => {
  const items = (e.clipboardData || window.clipboardData)?.items || [];
  for (const it of items){
    if (it.type && it.type.indexOf('image') === 0){
      e.preventDefault();
      const file = it.getAsFile();
      if (file) embedImage(file);
      return;
    }
  }
});
// drag & drop รูปลงช่อง editor
const wrapEl = document.getElementById('editorWrap');
['dragenter','dragover'].forEach(ev => wrapEl.addEventListener(ev, e => {
  if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')){ e.preventDefault(); wrapEl.classList.add('drag'); }
}));
['dragleave','drop'].forEach(ev => wrapEl.addEventListener(ev, () => wrapEl.classList.remove('drag')));
wrapEl.addEventListener('drop', e => {
  const files = e.dataTransfer?.files || [];
  const img = [...files].find(f => f.type.indexOf('image') === 0);
  if (img){ e.preventDefault(); embedImage(img); }
});

/* ============================================================
   2) Rich tooltip — แสดงตัวอย่างผลลัพธ์ของแต่ละปุ่มเมื่อ hover
   ============================================================ */
const TIPS = {
  heading:{ name:'Heading · หัวข้อ', key:'Ctrl+1…6', code:'# หัวข้อใหญ่',
    ex:'<div style="font-size:1.5em;font-weight:700;line-height:1.2">หัวข้อใหญ่</div>' },
  bold:{ name:'Bold · ตัวหนา', key:'Ctrl+B', code:'**ข้อความ**',
    ex:'นี่คือ <strong>ข้อความตัวหนา</strong>' },
  italic:{ name:'Italic · ตัวเอียง', key:'Ctrl+I', code:'*ข้อความ*',
    ex:'นี่คือ <em>ข้อความตัวเอียง</em>' },
  list:{ name:'Bullet List · รายการ', key:'Ctrl+Shift+L', code:'- รายการ',
    ex:'<ul style="padding-left:18px"><li>รายการที่หนึ่ง</li><li>รายการที่สอง</li></ul>' },
  task:{ name:'Task List · เช็กลิสต์', key:'', code:'- [ ] งานที่ต้องทำ',
    ex:'<div>☑ ทำเสร็จแล้ว<br>☐ ยังไม่ได้ทำ</div>' },
  quote:{ name:'Quote · คำอ้างอิง', key:'Ctrl+Shift+Q', code:'> คำพูด',
    ex:'<blockquote style="margin:0;border-left:3px solid var(--accent);padding-left:10px;color:var(--text-soft)">คำพูดที่ยกมาอ้างอิง</blockquote>' },
  table:{ name:'Table · ตาราง', key:'Ctrl+Shift+T', code:'| ชื่อ | อายุ |\n| --- | --- |\n| นัท | 20 |',
    ex:'<table style="border-collapse:collapse;font-size:11.5px"><tr><th style="border:1px solid var(--border);padding:3px 8px">ชื่อ</th><th style="border:1px solid var(--border);padding:3px 8px">อายุ</th></tr><tr><td style="border:1px solid var(--border);padding:3px 8px">นัท</td><td style="border:1px solid var(--border);padding:3px 8px">20</td></tr></table>' },
  codeblock:{ name:'Code Block · บล็อกโค้ด', key:'Ctrl+Shift+C', code:'```js\n…โค้ด…\n```',
    ex:'<pre style="margin:0;background:var(--code-bg);padding:7px 9px;border-radius:6px;font-size:11px;font-family:var(--mono)">console.log("hi");</pre>' },
  code:{ name:'Inline Code · โค้ดในบรรทัด', key:'Ctrl+E', code:'`code`',
    ex:'รัน <code style="background:var(--code-bg);padding:1px 5px;border-radius:4px;font-family:var(--mono)">npm install</code> ก่อน' },
  link:{ name:'Link · ลิงก์', key:'Ctrl+K', code:'[ข้อความ](https://…)',
    ex:'ดูที่ <a style="color:var(--accent)">เว็บไซต์นี้</a>' },
  image:{ name:'Image · รูปภาพ', key:'Ctrl+Shift+I', code:'![alt](รูป)\nหรือก็อปรูปแล้ว Ctrl+V',
    ex:'<div style="display:flex;align-items:center;gap:8px"><span style="font-size:22px">🖼️</span><span>แทรกรูป หรือ <b>ก็อปแล้ว Ctrl+V วางได้เลย</b> ไม่ต้องเซฟไฟล์ก่อน</span></div>' },
  hr:{ name:'Horizontal Rule · เส้นคั่น', key:'', code:'---',
    ex:'ข้อความก่อน<hr style="border:0;border-top:1px solid var(--border);margin:6px 0">ข้อความหลัง' },
};
const tip = document.getElementById('tipcard');
function showTip(btn){
  const d = TIPS[btn.dataset.kind]; if(!d) return;
  tip.querySelector('.tip-name').textContent = d.name;
  tip.querySelector('.tip-key').textContent = d.key || '—';
  tip.querySelector('.tip-ex').innerHTML = d.ex;
  tip.querySelector('.tip-code').textContent = d.code;
  tip.classList.add('show');
  const r = btn.getBoundingClientRect();
  let top = r.top + r.height/2 - tip.offsetHeight/2;       // จัดกึ่งกลางแนวตั้งกับปุ่ม
  top = Math.max(8, Math.min(top, window.innerHeight - tip.offsetHeight - 8));
  tip.style.top = top + 'px';
  tip.style.left = (r.left - tip.offsetWidth - 12) + 'px'; // วางทางซ้ายของ toolbar
}
function hideTip(){ tip.classList.remove('show'); }
document.querySelectorAll('.toolbar .tb').forEach(btn => {
  btn.addEventListener('mouseenter', () => showTip(btn));
  btn.addEventListener('mouseleave', hideTip);
  btn.addEventListener('focus', () => showTip(btn));
  btn.addEventListener('blur', hideTip);
});

/* ---------- shortcuts ---------- */
document.addEventListener('keydown',e=>{
  if(!(e.ctrlKey||e.metaKey)) return;
  const k=e.key.toLowerCase();
  if(e.shiftKey){
    if(k==='l'){fmt('list');e.preventDefault();}
    if(k==='q'){fmt('quote');e.preventDefault();}
    if(k==='t'){fmt('table');e.preventDefault();}
    if(k==='c'){fmt('codeblock');e.preventDefault();}
    if(k==='i'){fmt('image');e.preventDefault();}
  } else {
    const map={b:'bold',i:'italic',e:'code',k:'link'};
    if(map[k]){fmt(map[k]);e.preventDefault();}
  }
  if(/^[1-6]$/.test(e.key)){linePrefix('#'.repeat(+e.key)+' ');e.preventDefault();}
  if(k==='s'){e.preventDefault();save();}
});
function save(){ dirty=false; const s=document.getElementById('status'); s.textContent='● Saved'; s.className='badge-saved'; toast('บันทึกแล้ว (Ctrl+S)'); }

/* ---------- layout / theme / toast ---------- */
function setLayout(m){
  document.getElementById('editorPane').classList.toggle('hide', m==='prev');
  document.getElementById('previewPane').classList.toggle('hide', m==='edit');
  document.getElementById('seg-split').classList.toggle('active', m==='split');
  document.getElementById('seg-edit').classList.toggle('active', m==='edit');
  document.getElementById('seg-prev').classList.toggle('active', m==='prev');
}
function toggleTheme(){
  const b=document.body, dark=b.getAttribute('data-theme')==='dark';
  b.setAttribute('data-theme', dark?'light':'dark');
  document.getElementById('themeBtn').textContent = dark?'🌙':'☀️';
}
let tt;
function toast(msg){
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),1800);
}

/* ---------- init ---------- */
ed.value=SAMPLE; render(); save();
</script>
