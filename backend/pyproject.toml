[project]
name = "plainmark-backend"
version = "2.0.0"
description = "Local FastAPI backend for PlainMark v2 (project notes, search, and future meeting/knowledge modules)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.9",
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "pythainlp>=5.0",
    "openthai2-0-latte-wordseg-lite @ https://huggingface.co/iapp/OpenThai2.0-LATTE-WordSeg-Lite/resolve/main/openthai2_0_latte_wordseg_lite-0.1.2-py3-none-any.whl",
    "opencv-python-headless>=4.8",
    "pyclipper>=1.3",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.16", "httpx>=0.28"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]
