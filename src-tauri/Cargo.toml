[package]
name = "plainmark"
version = "0.8.1"
description = "PlainMark desktop app"
authors = ["PlainMark"]
edition = "2021"

[lib]
name = "plainmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
